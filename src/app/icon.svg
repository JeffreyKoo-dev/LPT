<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b790e6"/><stop offset="0.55" stop-color="#8a5fae"/><stop offset="1" stop-color="#6a3f94"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.7">
